name: Sync official plugins from GitCat

# Copies the plugins listed in official.sync.json from GitCat's own
# examples/plugins/ at a release tag, regenerates index.json, and opens a PR.
# GitCat's repo is the source of truth for these plugins (its smoke test runs
# them through the real manifest validator), so official/<id>/ for a synced
# plugin is generated output. See scripts/sync-official.mjs.
#
# Run it after each GitCat release: Actions → this workflow → Run workflow →
# enter the release tag (e.g. v1.4.1). Nothing is pushed to main directly; you
# review and merge the PR.
#
# Opening the PR needs the repo setting "Allow GitHub Actions to create and
# approve pull requests" (Settings → Actions → General).

on:
  workflow_dispatch:
    inputs:
      gitcat_ref:
        description: "GitCat release tag to sync from (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-official
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate the ref
        env:
          REF: ${{ inputs.gitcat_ref }}
        run: |
          if ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::gitcat_ref must be a release tag like v1.4.1, got '$REF'"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check out GitCat at ${{ inputs.gitcat_ref }}
        uses: actions/checkout@v4
        with:
          repository: zangjiucheng/GitCat
          ref: ${{ inputs.gitcat_ref }}
          path: _gitcat
          # Only what the sync reads: the examples and the docs that README
          # links are checked against.
          sparse-checkout: |
            examples/plugins
            docs
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync and rebuild the index
        env:
          REF: ${{ inputs.gitcat_ref }}
        run: |
          node scripts/sync-official.mjs --from _gitcat --ref "$REF"
          node scripts/build-index.mjs
          rm -rf _gitcat

      - name: Open a PR (if anything changed)
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.gitcat_ref }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed: official/ already matches GitCat $REF."
            exit 0
          fi
          branch="sync/gitcat-$REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A official official.sync.json index.json
          git commit -m "Sync official plugins from GitCat $REF"
          git push --force -u origin "$branch"
          if gh pr view "$branch" >/dev/null 2>&1; then
            echo "PR for $branch already exists; updated its branch."
          else
            gh pr create --base main --head "$branch" \
              --title "Sync official plugins from GitCat $REF" \
              --body "Generated by the **Sync official plugins** workflow from [\`zangjiucheng/GitCat@$REF\`](https://github.com/zangjiucheng/GitCat/tree/$REF/examples/plugins).

          - Copies each plugin listed in \`official.sync.json\` from GitCat's \`examples/plugins/\`.
          - Sets \`minGitcatVersion\` (default: the release synced from; per-plugin overrides in \`official.sync.json\`).
          - Rewrites README links that leave the plugin folder to the docs site / GitHub.
          - Regenerates \`index.json\`.

          Review the diff, then merge to publish to GitCat's in-app catalogue (Tools ▸ Plugins… → Browse)."
          fi
