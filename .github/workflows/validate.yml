name: Validate index

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: index.json matches official/ + community/
        run: node scripts/build-index.mjs --check
